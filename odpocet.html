<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vánoce – odpočet</title>
  <meta name="description" content="Odpočet do Vánoc a vánoční přání.">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>

  <header class="hlavicka">
    <a class="logo" href="index.html">🎄 Vánoce</a>
    <nav>
      <ul>
        <li><a href="index.html">Úvod</a></li>
        <li><a href="odpocet.html" class="aktivni" aria-current="page">Odpočet</a></li>
      </ul>
    </nav>
  </header>

  <main class="obsah">
    <h1>Odpočet do Vánoc</h1>
    <p id="cil-text" class="podnadpis">Do Štědrého dne zbývá:</p>

    <div class="odpocet" role="timer" aria-live="off">
      <div class="cas"><span id="dny">0</span><small>dní</small></div>
      <div class="cas"><span id="hodiny">0</span><small>hodin</small></div>
      <div class="cas"><span id="minuty">0</span><small>minut</small></div>
      <div class="cas"><span id="sekundy">0</span><small>sekund</small></div>
    </div>
    <p id="zprava" class="zprava"></p>

    <section class="prani">
      <h2>Napište vánoční přání</h2>
      <form id="formular" novalidate>
        <label for="jmeno">Vaše jméno</label>
        <input type="text" id="jmeno" name="jmeno" autocomplete="name">
        <span class="chyba" id="chyba-jmeno"></span>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <span class="chyba" id="chyba-email"></span>

        <label for="text">Přání</label>
        <textarea id="text" name="text" rows="3"></textarea>
        <span class="chyba" id="chyba-text"></span>

        <button type="submit" class="tlacitko">Odeslat přání</button>
      </form>
      <p id="vysledek" class="vysledek" role="status"></p>
    </section>
  </main>

  <footer class="paticka">&copy; 2026 Vánoční web · školní projekt</footer>
</body>
</html>
